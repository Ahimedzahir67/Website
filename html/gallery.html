<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery | GreenRoots Digital</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header>
    <div class="logo">GreenRoots Digital</div>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="services.html">Products</a></li>
            <li><a href="gallery.html">Gallery</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
</header>

<main>
    <section class="section">
        <h1>Gallery</h1>
        <p>Illustrations that show our digital products and design tools.</p>
        <div class="media-showcase">
            <img id="previewImage" src="../images/community.png" alt="Product preview" />
            <div class="preview-controls">
                <button id="prevImageBtn" type="button">Previous</button>
                <button id="nextImageBtn" type="button">Next</button>
            </div>
        </div>
        <div class="site-video">
            <h2>Promotional Video</h2>
            <video controls poster="../images/ebook-guide.png">
                <source src="../videos/intro.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
        <div class="cards">
            <div class="card">
                <h3>Template Preview</h3>
                <img src="../images/community.png" alt="Website template preview">
            </div>
            <div class="card">
                <h3>Ebook Cover</h3>
                <img src="../images/project.png" alt="Digital ebook cover">
            </div>
            <div class="card">
                <h3>Product Tool</h3>
                <img src="../images/volunteer.png" alt="Productivity tool illustration">
            </div>
        </div>
    </section>
</main>

<footer>
    <p>© <span class="year"></span> GreenRoots Digital</p>
</footer>

<script src="../js/script.js"></script>
</body>
</html>
